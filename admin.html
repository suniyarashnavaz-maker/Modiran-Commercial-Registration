<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Meridian Corporate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

  <!-- ===== LOGIN ===== -->
  <div class="admin-login" id="adminLogin">
    <div class="admin-login-card">
      <div class="lang-switch-host"></div>
      <div class="logo" style="justify-content:center; margin-bottom: 18px;"><span class="logo-mark">M</span> Meridian<span class="logo-accent">Corporate</span></div>
      <h1>Admin Panel</h1>
      <p class="admin-login-sub">Sign in to manage your site</p>
      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="adminEmail" placeholder="admin@meridiancorp.example" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="adminPass" placeholder="••••••••" required />
          <span class="error-msg">Password must be "admin".</span>
        </div>
        <button type="submit" class="btn btn-navy" style="width:100%;">Sign In</button>
        <p class="form-note" style="text-align:center;">Demo: any email + password "admin"</p>
      </form>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div class="admin-app" id="adminApp" hidden>
    <div class="topbar">
      <div class="container topbar-inner">
        <div class="topbar-left">☎ +1 (555) 010-2030</div>
        <div class="topbar-right">
          <a href="index.html" target="_blank">View Site</a>
        </div>
      </div>
    </div>

    <div class="admin-shell">
      <aside class="admin-side">
        <a href="index.html" class="logo" style="margin: 6px 0 18px;"><span class="logo-mark">M</span> Meridian<span class="logo-accent">Corporate</span></a>
        <nav class="admin-nav" id="adminNav">
          <button data-view="dashboard" class="active">📊 <span>Dashboard</span></button>
          <button data-view="orders">📦 <span>Orders</span></button>
          <button data-view="services">🏢 <span>Services</span></button>
          <button data-view="articles">📰 <span>Articles</span></button>
          <button data-view="messages">✉️ <span>Messages</span></button>
          <button data-view="users">👥 <span>Users</span></button>
          <button data-view="settings">⚙️ <span>Settings</span></button>
        </nav>
        <button class="admin-logout" id="adminLogout">↩ <span>Logout</span></button>
      </aside>

      <main class="admin-main">
        <!-- DASHBOARD -->
        <section class="admin-view" id="view-dashboard">
          <h2>Dashboard</h2>
          <div class="admin-stats" id="adminStats"></div>
          <h3 style="margin: 28px 0 12px;">Recent Orders</h3>
          <div class="admin-table-wrap" id="adminRecent"></div>
        </section>

        <!-- ORDERS -->
        <section class="admin-view" id="view-orders" hidden>
          <h2>Orders</h2>
          <div class="admin-table-wrap" id="adminOrdersTable"></div>
        </section>

        <!-- SERVICES -->
        <section class="admin-view" id="view-services" hidden>
          <h2>Services</h2>
          <div class="form-card" style="max-width: 640px; margin-bottom: 20px;">
            <h3 style="margin-bottom: 14px;">Add Service</h3>
            <form id="serviceForm">
              <div class="form-grid">
                <div class="form-group"><label>Title (EN)</label><input type="text" id="svcEn" required /></div>
                <div class="form-group"><label>Title (FA)</label><input type="text" id="svcFa" /></div>
                <div class="form-group"><label>Title (KU)</label><input type="text" id="svcKu" /></div>
              </div>
              <button type="submit" class="btn btn-navy btn-sm">Save</button>
            </form>
          </div>
          <div class="admin-table-wrap" id="adminServicesTable"></div>
        </section>

        <!-- ARTICLES -->
        <section class="admin-view" id="view-articles" hidden>
          <h2>Articles</h2>
          <div class="form-card" style="max-width: 640px; margin-bottom: 20px;">
            <h3 style="margin-bottom: 14px;">Add Article</h3>
            <form id="articleForm">
              <div class="form-grid">
                <div class="form-group full"><label>Title</label><input type="text" id="artTitle" required /></div>
                <div class="form-group"><label>Category</label><input type="text" id="artCat" placeholder="Registration" /></div>
                <div class="form-group"><label>Date</label><input type="date" id="artDate" /></div>
              </div>
              <button type="submit" class="btn btn-navy btn-sm">Save</button>
            </form>
          </div>
          <div class="admin-table-wrap" id="adminArticlesTable"></div>
        </section>

        <!-- MESSAGES -->
        <section class="admin-view" id="view-messages" hidden>
          <h2>Messages</h2>
          <div id="adminMessagesList"></div>
        </section>

        <!-- USERS -->
        <section class="admin-view" id="view-users" hidden>
          <h2>Users</h2>
          <div class="admin-table-wrap" id="adminUsersTable"></div>
        </section>

        <!-- SETTINGS -->
        <section class="admin-view" id="view-settings" hidden>
          <h2>Settings</h2>
          <div class="form-card" style="max-width: 560px;">
            <div class="success-banner" id="settingsSaved">Settings saved!</div>
            <form id="settingsForm">
              <div class="form-group"><label>Site Name</label><input type="text" id="setSiteName" value="Meridian Corporate" /></div>
              <div class="form-group"><label>Phone</label><input type="text" id="setPhone" value="+1 (555) 010-2030" /></div>
              <div class="form-group"><label>Email</label><input type="email" id="setEmail" value="hello@meridiancorp.example" /></div>
              <div class="form-group"><label>Working Hours</label><input type="text" id="setHours" value="Mon–Fri: 9:00 – 17:00 · Sat: 9:00 – 14:00" /></div>
              <button type="submit" class="btn btn-navy">Save Settings</button>
            </form>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="lang.js"></script>
  <script src="script.js"></script>
  <script src="admin.js"></script>
</body>
</html>
